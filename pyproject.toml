[project]
name = "chat-archive-mcp"
version = "1.0.0"
description = "会话归档检索 MCP：让 AI 搜索你的历史对话内容"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
chat-archive-mcp = "chat_archive_mcp:main"

[project.urls]
Homepage = "https://github.com/dafeiai918/chat-archive-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["chat_archive_mcp.py"]
